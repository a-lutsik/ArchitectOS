name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        # Runtime is stdlib-only; only the linter is needed for CI.
        run: python -m pip install --upgrade "ruff>=0.6"

      - name: Ruff (syntax + pyflakes)
        run: ruff check .

      - name: Unit + integration tests
        # Pin the offline hash embedder so tests stay deterministic and never
        # download a local model, regardless of what extras land in the image.
        env:
          MEMORY_EMBEDDING_PROVIDER: hash
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    name: Syntax check (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check on frontend scripts
        run: |
          shopt -s nullglob
          status=0
          for file in frontend/*.js; do
            if node --check "$file"; then
              echo "ok: $file"
            else
              echo "FAILED: $file"
              status=1
            fi
          done
          exit $status

      - name: Frontend load-order smoke
        run: node scripts/frontend_load_smoke.js
