[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architectos"
version = "1.0.0"
description = "Local-first AI workspace for software engineers: persistent memory, context packs, provider routing."
readme = "README.md"
requires-python = ">=3.12"
# Runtime is intentionally stdlib-only. The extras below enable optional
# accelerations that the code auto-detects when present.
dependencies = []

[project.optional-dependencies]
# Faster cosine index for memory embeddings (embeddings.py falls back to pure Python).
vectors = ["numpy>=1.26"]
# On-device real embedding model (no API keys). fastembed is lightweight (ONNX,
# no torch); LocalEmbeddingProvider also uses sentence-transformers if present.
# With this installed, a fresh setup gets real vectors instead of the hash fallback.
embeddings = ["fastembed>=0.3"]
# Mozilla CA bundle for HTTPS on systems without a system store (ssl_util.py falls back to the platform default).
tls = ["certifi>=2024.2.2"]
dev = ["ruff>=0.6"]
# One-file MCP binary (scripts/build_mcp.sh / .ps1). Not required at runtime.
packaging = ["pyinstaller>=6.0"]

[project.scripts]
# MCP memory server for external agents (Cursor, Copilot, Claude, Junie, ...).
# After `pip install -e .` run `architectos-mcp`; set ARCHITECTOS_ROOT to point
# at the checkout whose data/architectos.db should be shared.
architectos-mcp = "architectos.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
# The codebase predates a linter; keep the ruleset tight: high-value rules
# plus import sorting (I) and bugbear (B).
select = ["E9", "F", "I", "B"]
ignore = [
    # Many intentionally unused loop/unpack variables.
    "F841",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["backend/architectos"]
ignore_missing_imports = true
# Runtime is stdlib-only and the codebase is annotated but not strict-clean:
# keep mypy's default (lenient) checks and carve out the one systematically
# noisy error code below instead of scattering hundreds of inline ignores.

# The service layer is split into mixins (composed in service.py's
# ArchitectOSService) that rely on the host class for shared attributes
# (repository, security_policy, mcp_manager, ...). mypy cannot see those
# attributes from the mixin alone, so attr-defined fires hundreds of times
# with no signal. Disabled per-module; everything else stays on.
[[tool.mypy.overrides]]
module = [
    "architectos.ai_runtime_service",
    "architectos.azure_boards_sync",
    "architectos.azure_git_sync",
    "architectos.azure_sync_common",
    "architectos.azure_sync_service",
    "architectos.azure_wiki_sync",
    "architectos.chat_service",
    "architectos.chat_session_service",
    "architectos.graph_service",
    "architectos.ingestion_service",
    "architectos.integrations_service",
    "architectos.lifecycle_service",
    "architectos.project_scan_service",
    "architectos.providers_council_service",
    "architectos.retrieval_service",
    "architectos.settings_router_service",
    "architectos.teams_sync",
    "architectos.tool_exec_service",
]
disable_error_code = ["attr-defined"]

[tool.coverage.run]
# Only production modules count; tests/ and scripts/ are excluded by scoping
# the source to the backend package.
source = ["backend/architectos"]

[tool.coverage.report]
show_missing = true
skip_covered = false
