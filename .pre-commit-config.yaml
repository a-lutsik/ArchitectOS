# Run `pre-commit install` once after cloning (requires network to fetch the hook).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version used in CI / pyproject [project.optional-dependencies] dev.
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
