<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Mark Gradients -->
    <radialGradient id="lgo-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lgo-brain" x1="14" y1="8" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lgo-os-grad" x1="220" y1="20" x2="270" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="lgo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Logo Symbol Mark (64x64 Box) -->
  <g transform="translate(4, 0)">
    <circle cx="32" cy="32" r="28" fill="url(#lgo-ambient)" />
    
    <!-- PCB Corner Traces -->
    <path d="M12 28 L6 25 M12 36 L6 39 M52 28 L58 25 M52 36 L58 39" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
    <circle cx="6" cy="25" r="1.2" fill="#38bdf8"/>
    <circle cx="6" cy="39" r="1.2" fill="#06b6d4"/>
    <circle cx="58" cy="25" r="1.2" fill="#f472b6"/>
    <circle cx="58" cy="39" r="1.2" fill="#c084fc"/>

    <!-- Isometric Chip Pedestal -->
    <polygon points="32,36 48,45 32,54 16,45" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <!-- Dual Neon Rims -->
    <path d="M16 45 L32 54" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" filter="url(#lgo-glow)"/>
    <path d="M32 54 L48 45" stroke="#c084fc" stroke-width="2" stroke-linecap="round" filter="url(#lgo-glow)"/>

    <!-- Glowing Holographic Brain -->
    <g filter="url(#lgo-glow)">
      <!-- Brain Outer Silhouette -->
      <path d="M32 10
               C24 10 17 14 16 21
               C15 27 18 32 21 35
               C24 38 28 37 32 35
               C36 37 40 38 43 35
               C46 32 49 27 48 21
               C47 14 40 10 32 10 Z"
            fill="url(#lgo-brain)" opacity="0.3"/>
      
      <path d="M32 10
               C24 10 17 14 16 21
               C15 27 18 32 21 35
               C24 38 28 37 32 35
               C36 37 40 38 43 35
               C46 32 49 27 48 21
               C47 14 40 10 32 10 Z"
            fill="none" stroke="url(#lgo-brain)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Brain Longitudinal Divide -->
      <path d="M32 10 C31.5 17 31.5 25 32 35" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Synaptic Gyri -->
      <path d="M21 19 C25 20 27 24 23 28" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M43 19 C39 20 37 24 41 28" stroke="#e879f9" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Beacon Spark -->
    <circle cx="32" cy="10" r="1.6" fill="#ffffff"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(76, 0)">
    <!-- Primary Wordmark -->
    <text x="0" y="37" font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5px">
      <tspan fill="#fafafa">Architect</tspan><tspan fill="url(#lgo-os-grad)" dx="1">OS</tspan>
    </text>
    <!-- Secondary Subtitle -->
    <text x="1" y="52" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace" font-size="8.5" font-weight="700" letter-spacing="3.2px" fill="#71717a">
      DEVELOPER MEMORY OS
    </text>
  </g>
</svg>
